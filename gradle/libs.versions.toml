# The version catalog is the only place a version number is written.

[versions]
assertj = "3.27.7"
awsSdk = "2.59.5"
caffeine = "3.3.1"
dagger = "2.60.1"
dropwizard = "5.0.2"
flyway = "13.13.0"
jakartaInject = "2.0.1"
jackson = "3.3.0"
jakartaAnnotation = "3.0.0"
miniAuth = "0.1.0"
jdbi = "3.55.0"
jetcd = "0.8.8"
junit = "6.1.3"
mockito = "5.24.0"
openapiGenerator = "7.27.0"
nimbusJoseJwt = "10.10"
pgjdbc = "42.7.14"
slf4j = "2.0.20"
testcontainers = "2.0.5"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
aws-sdk-dynamodb = { module = "software.amazon.awssdk:dynamodb" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
dropwizard-bom = { module = "io.dropwizard:dropwizard-bom", version.ref = "dropwizard" }
dropwizard-core = { module = "io.dropwizard:dropwizard-core" }
dropwizard-testing = { module = "io.dropwizard:dropwizard-testing" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jakarta-inject = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakartaInject" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakartaAnnotation" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbi-postgres = { module = "org.jdbi:jdbi3-postgres", version.ref = "jdbi" }
jdbi-sqlobject = { module = "org.jdbi:jdbi3-sqlobject", version.ref = "jdbi" }
jetcd-core = { module = "io.etcd:jetcd-core", version.ref = "jetcd" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mini-idp-testkit = { module = "com.codeheadsystems:mini-idp-testkit", version.ref = "miniAuth" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
pgjdbc = { module = "org.postgresql:postgresql", version.ref = "pgjdbc" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

[bundles]
jdbi = ["jdbi-core", "jdbi-postgres", "jdbi-sqlobject"]
test = ["junit-jupiter", "assertj", "mockito-core",  "mockito-junit-jupiter"]

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
