# Local datastores for development and manual testing. Automated tests use Testcontainers instead.
#   docker compose up -d
services:
  # Pinned: the SQL backend's tests run against the same version (POSTGRES_IMAGE in
  # config-datastore-sql's test Postgres.java); change both together.
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: config
      POSTGRES_USER: config
      POSTGRES_PASSWORD: config
    ports:
      - "5432:5432"

  # Pinned: the DynamoDB backend's tests and config-integ run against the same version
  # (DYNAMODB_LOCAL_IMAGE in DynamodbLocal.java and Backends.java); change them together.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.17
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"

  # S3-compatible object store for the S3 backend. Pinned: the S3 contract tests run against the
  # same version (RUSTFS_IMAGE in config-datastore-s3's test RustFs.java); change both together.
  # Console at http://localhost:9001. Create the bucket before use, for example:
  #   aws --endpoint-url http://localhost:9000 s3 mb s3://config
  # (the tests use their own container and bucket, config-test, not this one).
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: config
      RUSTFS_SECRET_KEY: config-secret
    ports:
      - "9000:9000"
      - "9001:9001"
