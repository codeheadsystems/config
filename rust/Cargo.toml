[workspace]
resolver = "3"
members = [
    "config-model",
    "config-client",
    "config-library",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ned Wolpert <ned.wolpert@gmail.com>"]
repository = "https://github.com/codeheadsystems/config"
rust-version = "1.85"

[workspace.dependencies]
config-model = { path = "config-model", version = "0.1.0" }
